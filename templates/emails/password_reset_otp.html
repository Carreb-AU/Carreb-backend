<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; border: 1px solid #eaeaea; border-radius: 5px; }
        .header { background-color: #fff3f3; padding: 15px; text-align: center; border-radius: 5px 5px 0 0; color: #dc3545; }
        .content { padding: 20px; text-align: center; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #dc3545; margin: 20px 0; padding: 10px; background-color: #fff8f8; border-radius: 5px; }
        .footer { text-align: center; font-size: 12px; color: #6c757d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Password Reset Request</h2>
        </div>
        <div class="content">
            <p>You requested a password reset. Your OTP code is:</p>
            <div class="code">{{ code }}</div>
            <p>This code will expire in {{ expiry_minutes }} minutes.</p>
        </div>
        <div class="footer">
            <p>If you did not request this, please secure your account immediately and ignore this email.</p>
        </div>
    </div>
</body>
</html>
