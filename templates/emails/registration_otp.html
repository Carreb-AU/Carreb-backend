<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; border: 1px solid #eaeaea; border-radius: 5px; }
        .header { background-color: #f8f9fa; padding: 15px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { padding: 20px; text-align: center; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #007bff; margin: 20px 0; padding: 10px; background-color: #f1f8ff; border-radius: 5px; }
        .footer { text-align: center; font-size: 12px; color: #6c757d; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Welcome to Carreb!</h2>
        </div>
        <div class="content">
            <p>Your registration OTP code is:</p>
            <div class="code">{{ code }}</div>
            <p>This code will expire in {{ expiry_minutes }} minutes.</p>
        </div>
        <div class="footer">
            <p>If you did not request this, please ignore this email.</p>
        </div>
    </div>
</body>
</html>
